services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    image: ${BACKEND_IMAGE:-ecommerce-backend:dev}
    build:
      context: ./my-medusa-store
      dockerfile: Dockerfile.backend
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file:
      - ./docker/backend.env
    environment:
      NODE_ENV: production
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s


  storefront:
    image: ${STOREFRONT_IMAGE:-ecommerce-storefront:dev}
    container_name: ecommerce-storefront
    restart: unless-stopped
    env_file:
      - ./my-medusa-store/apps/storefront/.env.local
    environment:
      NODE_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
